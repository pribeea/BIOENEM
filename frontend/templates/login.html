<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOENEM - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-wrapper">

        <div class="illustration-side">
            <div class="illustration-content">
                <img
                    src="{{ url_for('static', filename='logo2.png') }}"
                    alt="BIOENEM Logo"
                    class="site-logo"
                >
            </div>
        </div>

        <div class="login-side">

            <div class="login-container">
                
                <a href="/" class="back-home">← Voltar para página inicial</a>

                <h1>BIOENEM</h1>

                <div class="subtitle">
                    Biologia para o ENEM
                </div>

                <div class="login-label">
                    Faça login para continuar
                </div>

                <form id="login-form">

                    <div class="form-group">

                        <label class="field-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="input-field"
                            id="email"
                            placeholder="nome@exemplo.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label class="field-label">
                            Senha
                        </label>

                        <input
                            type="password"
                            class="input-field"
                            id="senha"
                            placeholder="senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn-login"
                        id="btn-login"
                    >
                        Entrar
                    </button>

                </form>

                <div class="signup-link">
                    Não tem uma conta?
                    <a href="/cadastro">Cadastre-se aqui</a>
                </div>

                <a
                    href="#"
                    class="forgot-password"
                    onclick="recuperarSenha(); return false;"
                >
                    Esqueceu sua senha?
                </a>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>

        function recuperarSenha() {
            alert('Instruções de recuperação de senha enviadas para seu email!');
        }

    </script>

</body>
</html>
